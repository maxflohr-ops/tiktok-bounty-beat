name: smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The smoke suite runs against the in-repo Supabase mock so it is
      # deterministic and needs no repository secrets.
      VITE_SUPABASE_URL: http://127.0.0.1:54329
      VITE_SUPABASE_PUBLISHABLE_KEY: mock
      SUPABASE_URL: http://127.0.0.1:54329
      SUPABASE_SERVICE_ROLE_KEY: mock
      SMOKE_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start mock Supabase
        run: |
          node tests/mock-supabase.mjs > /tmp/mock-supabase.log 2>&1 &
          echo $! > /tmp/mock-supabase.pid

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "dev server is up"
              exit 0
            fi
            sleep 2
          done
          echo "dev server never became ready"
          cat /tmp/dev-server.log
          exit 1

      - name: Run Bounty Board smoke test
        run: bun run test:smoke

      - name: Dev server logs on failure
        if: failure()
        run: |
          cat /tmp/dev-server.log || true
          cat /tmp/mock-supabase.log || true

      - name: Stop dev server
        if: always()
        run: |
          kill "$(cat /tmp/dev-server.pid)" || true
          kill "$(cat /tmp/mock-supabase.pid)" || true
