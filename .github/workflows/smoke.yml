name: smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fallbacks are the public client-side Supabase config (shipped in the
      # site bundle) — repo secrets of the same name override them if set.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://abvqcdiutahxfkruxidk.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_WPo2DNkpff9D9K03tW5wxA_bdypdsWB' }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'abvqcdiutahxfkruxidk' }}
      # Server-side vars: the URL is public; the service-role key is a real
      # secret — the smoke test runs its data assertions only when it's set.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://abvqcdiutahxfkruxidk.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMOKE_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "dev server is up"
              exit 0
            fi
            sleep 2
          done
          echo "dev server never became ready"
          cat /tmp/dev-server.log
          exit 1

      - name: Run Bounty Board smoke test
        run: bun run test:smoke

      - name: Dev server logs on failure
        if: failure()
        run: cat /tmp/dev-server.log || true

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev-server.pid)" || true
